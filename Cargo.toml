[package]
name = "mutation"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mutate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
csv = "1.4"
serde_json = "1.0"
testsuite-generator = { git = "https://github.com/twright/robochart-testsuite-generator" }

[dev-dependencies]
proptest = "1.11"
